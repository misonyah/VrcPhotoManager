name: Release

# Triggered by pushing a tag like v1.2.3 (see README's "Releasing" section for the full flow:
# bump VrcPhotoManager.csproj's <Version>, update CHANGELOG.md, commit, tag, push tag). Publishes
# a self-contained win-x64 build, packages it with Velopack (installer + delta-update feed), and
# uploads everything to a GitHub Release matching the tag.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Install vpk (Velopack CLI)
        run: dotnet tool install -g vpk

      - name: Publish self-contained win-x64 build
        # Version comes from the tag via vpk pack's --packVersion below, not from this publish
        # step - GenerateAssemblyInfo is off in the csproj (works around a wpftmp CS0579
        # collision, see its comment), so a -p:Version here wouldn't embed into the exe anyway.
        run: >
          dotnet publish VrcPhotoManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          --output publish

      # No --signParams here - unsigned installer/exe for now (Windows SmartScreen will show an
      # "unknown publisher" warning on first run). See README's Releasing section for how to add
      # signing later without otherwise restructuring this workflow.
      - name: Package with Velopack
        run: >
          vpk pack
          --packId VrcPhotoManager
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe VrcPhotoManager.exe
          --icon Assets\app.ico
          --shortcuts Desktop,StartMenu
          --outputDir Releases

      # Plain-text SHA256 of every packaged file, verifiable with nothing more than stock
      # Windows (certutil -hashfile) or any *nix coreutils sha256sum -c - no GitHub CLI or
      # Sigstore tooling required, unlike the attestation below. Generated before that step so
      # its own attestation subject list also covers this file, not just the binaries.
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem -Path Releases -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          Set-Content -Path Releases/SHA256SUMS.txt -Value $lines -Encoding utf8

      # Cryptographically ties every packaged file (Setup.exe, nupkg, delta files, and the
      # checksums file above) to this exact commit + workflow run via GitHub's Sigstore-backed
      # attestation service (free for public repos) - see CODE_SIGNING.md and the README's
      # "Verifying a release" section for what this proves and how to check it. Independent of
      # (and not a substitute for) actual Authenticode signing - see that same doc for why.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "Releases/*"

      - name: Upload to GitHub Release
        run: >
          vpk upload github
          --repoUrl https://github.com/misonyah/VrcPhotoManager
          --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ github.ref_name }}
          --outputDir Releases
          --publish

      # vpk's uploader only knows about the files it itself packaged - explicitly attach the
      # checksums file too so it actually shows up as a downloadable release asset.
      # --clobber makes this idempotent regardless of whether vpk's own upload already grabbed
      # a same-named file from the output directory.
      - name: Attach checksums to the release
        run: gh release upload ${{ github.ref_name }} Releases/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
